# Cấu hình nginx cho stewiequiz.io.vn
# Chép tới: /etc/nginx/sites-available/stewiequiz
#   sudo ln -s /etc/nginx/sites-available/stewiequiz /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# LƯU Ý: chạy file này TRƯỚC khi có SSL (chỉ có block :80). Sau đó chạy
#   sudo certbot --nginx -d stewiequiz.io.vn -d www.stewiequiz.io.vn
# certbot sẽ TỰ sửa file này: thêm block :443, chứng chỉ, và chuyển hướng 80 -> 443.

server {
    listen 80;
    listen [::]:80;
    server_name stewiequiz.io.vn www.stewiequiz.io.vn;

    # PDF tải lên tối đa 50MB (khớp MAX_FILE_SIZE trong .env).
    # Thiếu dòng này nginx chặn ở 1MB -> giáo viên không upload được tài liệu.
    client_max_body_size 50M;

    # Ảnh webcam gửi liên tục + AI sinh câu hỏi chạy lâu -> nới timeout,
    # nếu không nginx cắt ngang giữa chừng (504) khi Gemini/Claude trả chậm.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # File tĩnh: để nginx phục vụ thẳng, không làm phiền Python (nhanh hơn nhiều).
    location /static/ {
        alias /var/www/stewiequiz/static/;
        expires 7d;
        access_log off;
    }

    # Kênh realtime của Socket.IO (giám sát webcam) — BẮT BUỘC có khối riêng này
    # để nâng cấp kết nối lên WebSocket. Thiếu nó thì giám sát trực tiếp không chạy.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 2 dòng dưới là thứ ProxyFix trong app.py đọc để biết đang chạy HTTPS.
        # Thiếu -> url_for(_external=True) sinh http:// -> Google OAuth báo
        # redirect_uri_mismatch, và rate limit thấy mọi người đều là IP 127.0.0.1.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
