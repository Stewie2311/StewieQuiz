<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Quên mật khẩu - Khoa TT-TT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/controls.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/square.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-enhance.css') }}">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card login-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div data-flash="{{ category }}" data-flash-message="{{ message }}" hidden></div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('auth.quen_mat_khau') }}" method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Email <span class="text-danger">*</span></label>
                <div class="input-group-custom">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="email@truong.edu.vn" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-auth primary w-100">
                <i class="fas fa-paper-plane me-2"></i>Gửi mã đặt lại
            </button>
        </form>

        <div class="auth-footer">
            Nhớ ra mật khẩu rồi? <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/flash.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/form-validate.js') }}"></script>
<script src="{{ url_for('static', filename='js/ui-enhance.js') }}"></script>
{% include 'components/footer_auth.html' %}
</body>
</html>
