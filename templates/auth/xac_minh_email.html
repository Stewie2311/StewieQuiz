<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Xác minh email - Khoa TT-TT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/controls.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/square.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}">

    <style>
        /* Ô nhập mã OTP: to, giãn ký tự cho dễ đọc */
        .otp-input {
            text-align: center;
            letter-spacing: 12px;
            font-size: 28px;
            font-weight: 700;
            padding-left: 12px !important;
        }
        .otp-input::placeholder { letter-spacing: 8px; font-weight: 400; }
    </style>
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-envelope-circle-check"></i>
            </div>
            <h1>Xác minh email</h1>
            <p>Nhập mã 6 số đã được gửi tới<br><strong>{{ email }}</strong></p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div data-flash="{{ category }}" data-flash-message="{{ message }}" hidden></div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('auth.xac_minh_email') }}" method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Mã xác minh <span class="text-danger">*</span></label>
                <div class="input-group-custom">
                    <input type="text" name="ma_otp" class="otp-input"
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           placeholder="------" autocomplete="one-time-code"
                           autofocus required>
                </div>
                <small class="text-muted">Mã có hiệu lực trong 10 phút.</small>
            </div>

            <button type="submit" class="btn-auth primary w-100">
                <i class="fas fa-check me-2"></i>Xác nhận
            </button>
        </form>

        <form action="{{ url_for('auth.gui_lai_ma') }}" method="POST" class="mt-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn-auth w-100" style="background:transparent;">
                <i class="fas fa-paper-plane me-2"></i>Gửi lại mã
            </button>
        </form>

        <div class="auth-footer">
            Nhập sai email? <a href="{{ url_for('auth.register') }}">Đăng ký lại</a>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/flash.js') }}"></script>
<script src="{{ url_for('static', filename='js/form-validate.js') }}"></script>
{% include 'components/footer_auth.html' %}
</body>
</html>
