<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Thẻ SAU: XANH DƯƠNG (sky -> blue) -->
    <linearGradient id="favGradBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Thẻ TRƯỚC: XANH LÁ (emerald -> green) -->
    <linearGradient id="favGradGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Thẻ SAU (trái), nghiêng nhẹ -->
  <g transform="rotate(-13 25 35)">
    <rect x="10" y="21" width="26" height="30" rx="5.5" fill="url(#favGradBlue)" stroke="#0b0b0b" stroke-width="4"/>
    <text x="23" y="42" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="21" font-weight="800" fill="#0b0b0b" text-anchor="middle">?</text>
  </g>
  <!-- Thẻ TRƯỚC (phải), to hơn -->
  <g transform="rotate(8 41 31)">
    <rect x="29" y="14" width="29" height="33" rx="5.5" fill="url(#favGradGreen)" stroke="#0b0b0b" stroke-width="4"/>
    <text x="43.5" y="36" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-size="23" font-weight="800" fill="#0b0b0b" text-anchor="middle">?</text>
  </g>
</svg>
